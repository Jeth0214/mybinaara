<div class="modal-header border-0 pb-0">
  <h5 class="modal-title font-weight-bold text-dark">Quick Stock Update</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="$event.stopPropagation(); activeModal.dismiss()" [disabled]="updating()"></button>
</div>
<div class="modal-body">
  <p class="text-muted mb-3 text-center">Update stock level for <strong>{{ product.catalog_product.name }}</strong></p>
  <div class="p-3 bg-light rounded border mb-4 text-center">
    <div class="small text-muted font-weight-bold mb-1" style="font-size: 0.75rem; letter-spacing: 0.5px;">CURRENT STOCK</div>
    <div class="h5 font-weight-bold mb-0 text-dark">
      {{ product.stock_quantity }} {{ product.catalog_product.unit?.name || 'units' }}
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label font-weight-bold text-muted small mb-1" style="font-size: 0.75rem; letter-spacing: 0.5px;">NEW STOCK QUANTITY</label>
    <input 
      type="number" 
      class="form-control text-center font-weight-bold" 
      style="height: 48px; font-size: 1.25rem;" 
      [value]="activeStockValue()" 
      (input)="onStockInputChange($event)"
      [disabled]="updating()"
    />
  </div>
</div>
<div class="modal-footer border-0 pt-0 d-flex gap-2">
  <button type="button" class="btn btn-light border px-4 py-2 font-weight-bold flex-grow-1" (click)="activeModal.dismiss()" [disabled]="updating()">Cancel</button>
  <button type="button" class="btn btn-success px-4 py-2 font-weight-bold text-white flex-grow-1 text-center d-flex align-items-center justify-content-center gap-2" (click)="saveQuickStock()" [disabled]="updating()">
    @if (updating()) {
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...
    } @else {
      Save Stock
    }
  </button>
</div>
