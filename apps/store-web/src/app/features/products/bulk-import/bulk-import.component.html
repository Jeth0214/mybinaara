<div class="container py-4" style="max-width: 1200px;">

  <!-- Page Header -->
  <div class="d-md-flex justify-content-between align-items-center mb-4 pb-2">
    <div>
      <h1 class="h3 font-weight-bold text-dark mb-1">Bulk Import Products</h1>
      <p class="text-muted small mb-0">Synchronize your store catalog by uploading spreadsheet lists.</p>
    </div>
    <div>
      <a
        class="btn btn-outline-success font-weight-bold px-4 py-2 border d-flex align-items-center gap-2"
        [routerLink]="loading() ? null : ['/products']"
        [class.disabled]="loading()"
        [style.pointer-events]="loading() ? 'none' : 'auto'"
      >
        <i class="bi bi-list-ul"></i> View Products
      </a>
    </div>
  </div>

  <!-- Step Indicators Row -->
  <app-import-steps [currentStep]="currentStep()"></app-import-steps>

  <!-- STEP 1 VIEW: UPLOAD FILE -->
  @if (currentStep() === 1) {
    <app-import-upload
      [loading]="loading()"
      (fileSelected)="onFileSelected($event)"
      (templateDownload)="downloadTemplate()"
    ></app-import-upload>
  }

  <!-- STEP 2 VIEW: REVIEW & VALIDATE -->
  @else if (currentStep() === 2) {
    <app-import-validation
      [selectedFileName]="selectedFileName()"
      [importRows]="importRows()"
      [readyCount]="readyCount()"
      [warningsCount]="warningsCount()"
      [errorsCount]="errorsCount()"
      [loading]="loading()"
      (fixErrors)="resetToStep1()"
      (confirmImport)="importProducts()"
    ></app-import-validation>
  }

  <!-- STEP 3 VIEW: SUCCESS CONFIRMATION -->
  @else if (currentStep() === 3) {
    <app-import-success
      [readyCount]="readyCount()"
      (importAnother)="resetToStep1()"
    ></app-import-success>
  }

</div>
