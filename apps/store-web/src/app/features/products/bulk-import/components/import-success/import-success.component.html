<div class="success-container-card text-center py-5 bg-white rounded border">
  <div class="success-checkmark-circle mb-4 mx-auto">
    <i class="bi bi-check-lg text-white"></i>
  </div>
  <h2 class="success-title font-weight-bold mb-2 text-dark">Products Imported Successfully!</h2>
  <p class="success-text text-muted mb-4 mx-auto" style="max-width: 500px; font-size: 1.05rem;">
    We successfully listed <strong>{{ readyCount }}</strong> new building materials to your warehouse catalog. They are now live and visible for customers.
  </p>
  <div class="d-flex justify-content-center gap-3">
    <button 
      type="button" 
      class="btn btn-outline-success font-weight-bold px-4 py-2 border rounded-pill" 
      (click)="onImportAnother()"
    >
      Import Another File
    </button>
    <a 
      class="btn btn-success font-weight-bold px-4 py-2 text-white rounded-pill" 
      [routerLink]="['/products']"
    >
      Go to Products <i class="bi bi-arrow-right"></i>
    </a>
  </div>
</div>
