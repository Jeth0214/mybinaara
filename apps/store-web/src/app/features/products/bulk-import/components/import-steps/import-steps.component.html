<div class="steps-row mb-3">
  <!-- Step 1 Card -->
  <div 
    class="step-card" 
    [class.step-active]="currentStep === 1"
    [class.step-completed]="currentStep > 1"
  >
    <div class="step-icon">
      @if (currentStep > 1) {
        <i class="bi bi-check-lg text-white"></i>
      } @else {
        1
      }
    </div>
    <div class="step-info">
      <div class="step-title">Upload file</div>
      <div class="step-subtitle">CSV or Excel with your products</div>
    </div>
  </div>

  <!-- Step 2 Card -->
  <div 
    class="step-card" 
    [class.step-active]="currentStep === 2"
    [class.step-completed]="currentStep > 2"
  >
    <div class="step-icon">
      @if (currentStep > 2) {
        <i class="bi bi-check-lg text-white"></i>
      } @else {
        2
      }
    </div>
    <div class="step-info">
      <div class="step-title">Review & validate</div>
      <div class="step-subtitle">Check for errors before importing</div>
    </div>
  </div>

  <!-- Step 3 Card -->
  <div 
    class="step-card" 
    [class.step-active]="currentStep === 3"
  >
    <div class="step-icon">
      3
    </div>
    <div class="step-info">
      <div class="step-title">Import products</div>
      <div class="step-subtitle">Products go live on your store</div>
    </div>
  </div>
</div>
