<div class="card p-4 border shadow-sm mt-4">
  <h3 class="mb-3 font-weight-bold text-dark" style="font-size: 1.1rem;">Upload your product file</h3>
  
  <!-- Drag & Drop Box -->
  <div 
    class="dropzone-box py-5 text-center cursor-pointer" 
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
    (click)="!loading && fileInput.click()"
    [class.disabled-dropzone]="loading"
  >
    <input 
      type="file" 
      #fileInput 
      (change)="onFileSelected($event)" 
      style="display: none;" 
      accept=".csv,.xlsx"
      [disabled]="loading"
    />
    <div class="upload-circle-icon mb-3 mx-auto">
      <i class="bi bi-upload"></i>
    </div>
    <h4 class="dropzone-title font-weight-bold">Drop your file here</h4>
    <p class="dropzone-text text-muted mb-0">
      Supports CSV and Excel (.xlsx) — <span class="text-success font-weight-bold" style="text-decoration: underline;">browse files</span>
    </p>
  </div>

  <!-- CSV template banner -->
  <div class="template-banner mt-4 d-flex flex-column flex-md-row gap-2  align-items-center justify-content-between p-3 bg-light rounded border">
   
    <p class="text-muted small mb-2 mb-md-0 text-center">Download our CSV template with required column headers</p>

    <button 
      type="button" 
      class="btn btn-outline-success rounded btn-sm px-3 py-2 font-weight-bold bg-white" 
      (click)="triggerDownload()"
      [disabled]="loading"
    >
      Download template
    </button>
  </div>
</div>
