<div class="store-profile-container">

  <!-- Header Section -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="page-title h3 mb-1">Store settings</h1>
      <p class="page-subtitle text-muted mb-0">Manage your store information, security preferences, and subscription plan.</p>
    </div>
  </div>

  @if (errorMsg()) {
    <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
      <div>{{ errorMsg() }}</div>
    </div>
  }

  <!-- Tab Switcher (Matching Mockup Pills Style) -->
  <div class="profile-tabs mb-4">
    <button
      type="button"
      class="tab-pill"
      [class.active]="activeTab === 'info'"
      (click)="setTab('info')"
    >
      Store Profile
    </button>
    <button
      type="button"
      class="tab-pill"
      [class.active]="activeTab === 'security'"
      (click)="setTab('security')"
    >
      <span class="d-none d-md-inline">Account & </span>Security
    </button>
    <button
      type="button"
      class="tab-pill"
      [class.active]="activeTab === 'subscription'"
      (click)="setTab('subscription')"
    >
      Subscription
    </button>
  </div>

  <!-- TAB CONTENT -->
  @if (activeTab === 'info') {
    <app-store-info-tab></app-store-info-tab>
  } @else if (activeTab === 'security') {
    <app-store-security-tab></app-store-security-tab>
  } @else if (activeTab === 'subscription') {
    <app-store-subscription-tab></app-store-subscription-tab>
  }

</div>
