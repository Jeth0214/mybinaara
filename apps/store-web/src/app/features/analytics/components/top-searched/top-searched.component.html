<div class="card insights-card p-4 rounded-3 border bg-white shadow-sm h-100">
  <h3 class="insights-card-title font-weight-bold mb-1 text-dark">Top searched products nearby</h3>
  <p class="insights-card-subtitle text-muted mb-4 small">
    What customers are searching for within <strong>{{ selectedDistance }}</strong> of your store
  </p>

  <div class="top-products-list d-flex flex-column gap-3">
    @for (product of products; track product.rank) {
      <div class="product-row d-flex align-items-center gap-3">
        <div class="product-rank font-weight-bold text-muted" style="width: 20px;">{{ product.rank }}</div>
        
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="product-name font-weight-bold text-dark">{{ product.name }}</span>
            <span class="product-searches small text-muted font-weight-bold">{{ product.searches }} searches</span>
          </div>
          <div class="progress-bar-container rounded-pill overflow-hidden bg-light" style="height: 6px;">
            <div 
              class="progress-bar bg-success rounded-pill" 
              [style.width]="getProgressWidth(product)"
              style="height: 100%; transition: width 0.3s ease;"
            ></div>
          </div>
        </div>

        <div class="product-action-badge text-end" style="width: 110px;">
          @if (product.inStore) {
            <span class="badge-custom badge-stocked text-success bg-light border-success px-2 py-1 rounded small font-weight-bold">
              You stock this
            </span>
          } @else {
            <a 
              class="badge-custom badge-not-stocked text-danger bg-light-danger border-danger px-2 py-1 rounded small font-weight-bold text-decoration-none"
              [routerLink]="['/products/add']"
              [queryParams]="{ name: product.name, category: product.category }"
            >
              Not in store +
            </a>
          }
        </div>
      </div>
    }
  </div>
</div>
