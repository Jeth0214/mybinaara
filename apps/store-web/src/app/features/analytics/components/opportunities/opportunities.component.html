<div class="card insights-card p-4 rounded-3 border bg-white shadow-sm h-100">
  <h3 class="insights-card-title font-weight-bold mb-1 text-dark">Opportunities — add these products</h3>
  <p class="insights-card-subtitle text-muted mb-4 small">
    High-demand items customers searched for but couldn't find nearby
  </p>

  <div class="opportunities-list d-flex flex-column gap-3">
    @for (opp of opportunities; track opp.name) {
      <div class="opportunity-row d-flex align-items-center gap-3">
        <!-- Circular icon representing category or product type -->
        <div class="opp-icon-wrapper rounded-3 d-flex align-items-center justify-content-center flex-shrink-0">
          <i class="bi" [ngClass]="opp.icon"></i>
        </div>

        <div class="flex-grow-1">
          <div class="product-name font-weight-bold text-dark mb-0.5">{{ opp.name }}</div>
          <div class="product-description small text-muted">
            <span class="searches-cnt font-weight-bold text-dark-gray">{{ opp.searches }} searches</span> · {{ opp.description }}
          </div>
        </div>

        <div class="add-action text-end flex-shrink-0" style="width: 90px;">
          <a 
            class="btn-add-now font-weight-bold text-decoration-none small"
            [routerLink]="['/products/add']"
            [queryParams]="{ name: opp.name, category: opp.category, description: opp.description }"
          >
            Add now &rarr;
          </a>
        </div>
      </div>
    }
  </div>
</div>
