<div class="container py-4" style="max-width: 1200px;">
  
  <!-- Page Header and Filters -->
  <div class="d-md-flex justify-content-between align-items-center mb-4 pb-2">
    <div>
      <h1 class="h3 font-weight-bold text-dark mb-1">Search Insights</h1>
      <p class="text-muted small mb-0">
        See what customers are searching for and how your products are performing.
      </p>
    </div>
    
    <!-- Filter inputs -->
    <app-insights-filters
      [selectedDistance]="selectedDistance()"
      [selectedPeriod]="selectedPeriod()"
      (distanceChange)="onDistanceChange($event)"
      (periodChange)="onPeriodChange($event)"
      class="mt-3 mt-md-0"
    ></app-insights-filters>
  </div>

  @if (loading()) {
    <div class="text-center py-5 my-5 animate__animated animate__fadeIn">
      <span class="spinner-border text-success" role="status" aria-hidden="true" style="width: 3rem; height: 3rem;"></span>
      <p class="text-muted mt-3 font-weight-bold">Querying API insights database...</p>
    </div>
  } @else {
    <!-- Dashboard Content Grid -->
    <div class="row g-4 mb-4 animate__animated animate__fadeIn">
      <!-- Top Searched Section -->
      <div class="col-lg-6 col-md-12">
        <app-top-searched
          [products]="topSearchedProducts()"
          [selectedDistance]="selectedDistance()"
        ></app-top-searched>
      </div>

      <!-- Opportunities Section -->
      <div class="col-lg-6 col-md-12">
        <app-opportunities
          [opportunities]="opportunities()"
        ></app-opportunities>
      </div>
    </div>

    <!-- Performance Section -->
    <div class="row animate__animated animate__fadeIn">
      <div class="col-12">
        <app-performance
          [products]="performanceProducts()"
        ></app-performance>
      </div>
    </div>
  }

</div>
