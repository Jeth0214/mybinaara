<div class="card overview-card p-3 p-md-4 rounded-3 border-0 bg-white shadow-sm h-100">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="overview-card-title font-weight-bold mb-1">Catalog Growth</h3>
      <p class="overview-card-subtitle text-muted small mb-0">Products added over the last 30 days.</p>
    </div>
  </div>

  @if (hasActivity()) {
    <div class="chart-container" style="height: 260px;">
      <canvas
        baseChart
        [data]="lineChartData()"
        [options]="lineChartOptions"
        [type]="'line'"
      ></canvas>
    </div>
  } @else {
    <div class="d-flex flex-column align-items-center justify-content-center text-center py-5">
      <i class="bi bi-graph-up text-muted fs-2 mb-2 opacity-50"></i>
      <p class="small text-muted mb-0">No products added in the last 30 days.</p>
    </div>
  }
</div>
