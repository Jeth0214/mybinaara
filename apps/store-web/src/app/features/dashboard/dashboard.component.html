<div class="container py-4" style="max-width: 1200px;">
  
  @if (loading()) {
    <div class="text-center py-5 my-5 animate__animated animate__fadeIn">
      <span class="spinner-border text-success" role="status" aria-hidden="true" style="width: 3rem; height: 3rem;"></span>
      <p class="text-muted mt-3 font-weight-bold">Loading dashboard metrics...</p>
    </div>
  } @else {
    <div class="animate__animated animate__fadeIn">
      <!-- Section 1: Greeting & Operating Hours -->
      <app-dashboard-greeting [user]="user()"></app-dashboard-greeting>

      <!-- Section 2: Products -->
      <div class="row g-4 mb-4">
        <div class="col-12">
          <app-dashboard-products
            [productsCount]="productsCount()"
            [productsLimit]="productsLimit()"
            [progressPercent]="progressPercent()"
            [inStockCount]="inStockCount()"
            [lowStockCount]="lowStockCount()"
            [outOfStockCount]="outOfStockCount()"
          ></app-dashboard-products>
        </div>
      </div>

      <!-- Section 3: Support Contact & Copyright Footer -->
      <div class="row g-4">
        <div class="col-12">
          <app-dashboard-footer></app-dashboard-footer>
        </div>
      </div>
    </div>
  }

</div>
