<div class="p-4">
  <div class="text-center">
    <div
      class="mb-3 mx-auto d-flex align-items-center justify-content-center"
      style="width: 64px; height: 64px; border-radius: 50%; font-size: 2rem; background-color: rgba(192, 57, 43, 0.1); color: var(--brand-error);"
    >
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h5 class="fw-bold text-dark mb-2">Suspend Product</h5>
    <p class="text-muted mb-3 fs-7">
      Suspending <strong>{{ product.catalog_product.name }}</strong> will hide it from customers immediately. This reason will be visible to the vendor.
    </p>
  </div>

  <div class="mb-3 text-start">
    <label class="form-label fw-semibold fs-8 text-uppercase text-muted">Reason <span class="text-danger">*</span></label>
    <textarea class="form-control fs-7" rows="3" [ngModel]="reason()" (ngModelChange)="reason.set($event)"></textarea>
    @if (!reason().trim()) {
      <div class="text-danger fs-8 mt-1">A suspension reason is required.</div>
    }
  </div>

  <div class="d-flex justify-content-center gap-3">
    <button type="button" class="btn btn-light px-4 py-2 font-weight-bold border" (click)="activeModal.dismiss(false)">Cancel</button>
    <button type="button" class="btn btn-danger px-4 py-2 font-weight-bold" [disabled]="!reason().trim()" (click)="confirm()">
      Confirm Suspension
    </button>
  </div>
</div>
