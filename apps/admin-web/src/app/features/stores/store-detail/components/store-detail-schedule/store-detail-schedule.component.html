<div class="card border-0 shadow-sm overflow-hidden mt-4">
  <form [formGroup]="scheduleForm" (ngSubmit)="onSave()">
    <div class="card-header bg-white py-3 border-bottom-0">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-clock text-success fs-5"></i>
          <h5 class="fw-bold text-dark mb-0">Working Hours & Operations Schedule</h5>
        </div>
        <button 
          type="submit" 
          class="btn btn-sm btn-success d-flex align-items-center gap-2 fw-semibold px-4 py-1.5"
          [disabled]="scheduleForm.pristine || scheduleForm.invalid"
        >
          <i class="bi bi-save"></i>
          <span>Save</span>
        </button>
      </div>
    </div>
    
    <div class="table-responsive border-top">
      <table class="table table-hover align-middle mb-0 custom-table">
        <thead class="table-light text-uppercase fs-8 fw-semibold text-muted">
          <tr>
            <th scope="col" class="ps-4" style="width: 250px;">Day of the Week</th>
            <th scope="col" style="width: 280px;">Open Time</th>
            <th scope="col" style="width: 280px;">Close Time</th>
            <th scope="col" class="text-end pe-4" style="width: 150px;">Status</th>
          </tr>
        </thead>
        <tbody formGroupName="workingHours">
          @for (day of days; track day.key) {
            <tr [formGroupName]="day.key" style="transition: background-color 0.2s;">
              <!-- Day Label -->
              <td class="ps-4 py-2">
                <span class="fw-bold text-dark fs-7-5" [class.text-warning]="day.key === 'fri'">{{ day.label }}</span>
              </td>
              
              <!-- Open Time Select -->
              <td class="py-2">
                <select
                  formControlName="openTime"
                  class="form-select form-select-sm fs-7-5"
                  style="height: 38px; max-width: 220px;"
                >
                  <option value="">Closed / Off</option>
                  @for (time of timeSlots; track time) {
                    <option [value]="time">{{ time }}</option>
                  }
                </select>
              </td>
              
              <!-- Close Time Select -->
              <td class="py-2">
                <select
                  formControlName="closeTime"
                  class="form-select form-select-sm fs-7-5"
                  style="height: 38px; max-width: 220px;"
                >
                  <option value="">Closed / Off</option>
                  @for (time of timeSlots; track time) {
                    <option [value]="time">{{ time }}</option>
                  }
                </select>
              </td>
              
              <!-- Status Switch / Checkbox -->
              <td class="text-end pe-4 py-2">
                <div class="form-check form-switch d-inline-flex align-items-center mb-0">
                  <input 
                    class="form-check-input" 
                    type="checkbox" 
                    formControlName="isOff" 
                    [id]="'isOff-tab-' + day.key"
                    style="cursor: pointer; width: 1.85rem; height: 0.95rem;"
                  />
                  <label class="form-check-label small fw-semibold text-muted ms-2" [for]="'isOff-tab-' + day.key" style="cursor: pointer; font-size: 0.72rem;">
                    Off
                  </label>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </form>
</div>
