@if (store().status === 'pending') {
  <div class="card border-0 shadow-sm bg-success bg-opacity-5 border border-success border-opacity-20">
    <div class="card-body p-4">
      <h6 class="fw-bold text-light border-bottom pb-2 mb-3 text-uppercase fs-7-5">
        <i class="bi bi-send me-2"></i> Onboarding Credentials
      </h6>
      
      <div class="mb-3">
        <label class="form-label fs-8 text-muted fw-semibold text-uppercase mb-1">Temporary Password</label>
        <input
          type="text"
          readonly
          class="form-control form-control-sm font-monospace text-success fw-bold bg-white"
          [value]="store().tempPassword"
        />
      </div>

      <div class="mb-0">
        <label class="form-label fs-8 text-muted fw-semibold text-uppercase mb-1">Activation Link</label>
        <input
          type="text"
          readonly
          class="form-control form-control-sm font-monospace text-success bg-white text-break"
          value="https://mybinaara.com/activate"
        />
      </div>
    </div>
  </div>
}
