<div class="container py-4" style="max-width: 1200px;">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
    <div>
      <h4 class="fw-bold mb-1">Store & Vendor Directory</h4>
      <p class="text-muted mb-0">Manage registered merchant accounts, verification status, and plans in Saudi Arabia</p>
    </div>
    <div class="d-flex gap-2">
      <a
        routerLink="create"
        class="btn btn-success d-flex align-items-center gap-2"
        [class.disabled]="mutating()"
        [attr.aria-disabled]="mutating()"
        (click)="mutating() && $event.preventDefault()"
      >
        <i class="bi bi-plus-lg"></i>
        <span>Add New Store</span>
      </a>
    </div>
  </div>

  <!-- Filters Subcomponent -->
  <app-store-list-filters
    [(searchQuery)]="searchQuery"
    [(statusFilter)]="statusFilter"
    [disabled]="mutating() || isDirectoryEmpty()"
  />

  @if (loadError()) {
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body text-center py-5">
        <div class="text-danger fs-7-5 mb-3">{{ loadError() }}</div>
        <button type="button" class="btn btn-light btn-sm" (click)="loadStores(meta()?.current_page ?? 1)">Retry</button>
      </div>
    </div>
  } @else {
    <!-- Table Directory Subcomponent -->
    <app-store-list-table
      [stores]="stores()"
      [totalStores]="meta()?.total ?? 0"
      [pageIndex]="(meta()?.current_page ?? 1) - 1"
      [loading]="loading()"
      [hasActiveFilters]="hasActiveFilters()"
      (deleteStore)="deleteStore($event)"
      (pageChange)="handlePageEvent($event)"
    />
  }
</div>
