<div class="row g-4 mt-2">
  <div class="col-lg-9 mx-auto">
    <form [formGroup]="form()">
      <h5 class="fw-semibold mb-3">Step 2: Location & Schedule Setup</h5>
      <p class="text-muted fs-8 mb-3">Adding a location is optional. Use the map below, or leave it blank to skip.</p>

      <!-- Location Configuration -->
      <div class="card p-4 border shadow-sm mb-4 bg-white">
        <h6 class="fw-bold text-dark border-bottom pb-2 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-map text-success"></i> Store location <span class="text-muted fw-normal fs-8">(optional)</span>
        </h6>

        <app-store-location-picker
          [initialLocation]="existingLocation()"
          (locationChange)="onLocationChange($event)"
        />
      </div>

      <!-- Working Hours Section -->
      <div class="card p-4 border shadow-sm mb-4 bg-white">
        <div class="card-header-block mb-3">
          <h6 class="fw-bold text-dark mb-1">Working Hours (Schedule)</h6>
          <p class="text-muted mb-0 fs-8">Friday is pre-set as the weekly day off per Saudi working week</p>
        </div>

        <div formGroupName="workingHours" class="working-hours-grid">
          @for (day of days; track day.key) {
            <div [formGroupName]="day.key" class="day-schedule-row d-flex align-items-center py-2 border-bottom">

              <div class="day-label fw-semibold text-dark" style="width: 80px;" [class.text-warning]="day.key === 'fri'">
                {{ day.label }}
              </div>

              <div class="time-input-cell flex-grow-1 mx-2">
                <select
                  formControlName="openTime"
                  class="form-select fs-7"
                  style="height: 38px;"
                >
                  <option value="">Closed / Off</option>
                  @for (time of timeSlots; track time) {
                    <option [value]="time">{{ time }}</option>
                  }
                </select>
              </div>

              <div class="time-input-cell flex-grow-1 mx-2">
                <select
                  formControlName="closeTime"
                  class="form-select fs-7"
                  style="height: 38px;"
                >
                  <option value="">Closed / Off</option>
                  @for (time of timeSlots; track time) {
                    <option [value]="time">{{ time }}</option>
                  }
                </select>
              </div>

              <div class="form-check ms-3 mb-0 d-flex align-items-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  formControlName="isOff"
                  [id]="'isOff-' + day.key"
                  style="cursor: pointer; width: 1.15rem; height: 1.15rem;"
                />
                <label class="form-check-label small fw-semibold text-muted ms-2 d-none d-md-block mb-0" [for]="'isOff-' + day.key" style="cursor: pointer;">
                  Off
                </label>
              </div>

            </div>
          }
        </div>
      </div>

      <!-- Navigation buttons -->
      <div class="d-flex justify-content-between mt-4 pt-3 border-top">
        <button type="button" class="btn btn-outline-secondary px-4" matStepperPrevious>
          Previous
        </button>
        <button type="button" class="btn btn-success shadow-2xs px-4" matStepperNext [disabled]="form().invalid">
          Next Step
        </button>
      </div>
    </form>
  </div>
</div>
