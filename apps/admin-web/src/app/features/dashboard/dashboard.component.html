<div class="container py-4" style="max-width: 1200px;">

  @if (loading()) {
    <div class="text-center py-5 my-5">
      <span class="spinner-border text-success" role="status" aria-hidden="true" style="width: 3rem; height: 3rem;"></span>
      <p class="text-muted mt-3">Loading platform metrics...</p>
    </div>
  } @else {
    <div class="dashboard-content">

      <!-- Greeting Header Section -->
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
          <h3 class="fw-bold text-dark mb-1">Assalamu Alaikum, Admin 👋</h3>
          <p class="text-muted mb-0 fs-7-5">Welcome back to the MyBinaara Admin Console. Monitor store registrations, verify documents, and configure catalog taxonomies.</p>
        </div>
        <div class="text-end d-none d-md-block">
          <span class="badge bg-light text-secondary border px-3 py-2 fs-8 fw-semibold">
            <i class="bi bi-calendar-event me-1.5"></i>
            {{ today | date:'fullDate' }}
          </span>
        </div>
      </div>

      <!-- Section 1: Quick Actions -->
      <app-quick-actions class="mb-4 d-block" />

      <!-- Section 2: Stats KPIs -->
      <app-stats-overview [stats]="computedStats()" class="mb-4 d-block" />

      <!-- Section 3: Analytics Visuals -->
      <app-analytics-charts class="mb-4 d-block" />

      <!-- Section 4: Recent Stores + Activity Feed -->
      <div class="row g-4">
        <div class="col-lg-7 col-md-12">
          <app-recent-stores [stores]="recentStores()" />
        </div>
        <div class="col-lg-5 col-md-12">
          <app-store-activity [activities]="activity()" />
        </div>
      </div>

    </div>
  }

</div>
