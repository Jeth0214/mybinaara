<ion-header class="ion-no-border search-page-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <button class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title>Search</ion-title>
  </ion-toolbar>

  <app-search-bar
    [query]="query()"
    (queryChange)="query.set($event)"
  ></app-search-bar>

  <app-home-categories
    [categories]="categories"
    [activeCategory]="selectedCategory()"
    (categorySelected)="onCategorySelected($event)"
  ></app-home-categories>
</ion-header>

<ion-content class="search-content">
  <div class="search-body">
    @if (hasQuery()) {
      <app-search-filters
        [activeFilter]="activeFilter()"
        [priceAsc]="priceAsc()"
        (filterChange)="onFilterChange($event)"
      ></app-search-filters>

      @if (filteredResults().length > 0) {
        <app-search-results
          [products]="filteredResults()"
          [query]="query()"
          [selectedCategory]="selectedCategory()"
        ></app-search-results>
      } @else {
        <app-search-empty-state [hasQuery]="true" [query]="query()"></app-search-empty-state>
      }
    } @else {
      <app-search-empty-state [hasQuery]="false" [query]="''"></app-search-empty-state>
    }
  </div>
</ion-content>
