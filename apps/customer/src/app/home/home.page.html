<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      myBINAARA
    </ion-title>
    <ion-buttons slot="end">
      <ion-button color="tertiary">
        <ion-icon slot="icon-only" name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">myBINAARA</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container" class="ion-padding">
    <div class="brand-welcome tw-text-center">
      <h1 class="tw-font-bold tw-text-3xl tw-text-[var(--brand-primary-legible)]">Welcome to myBINAARA</h1>
      <p class="tw-text-sm tw-opacity-80">Construction Materials Sourcing Platform</p>
    </div>

    <ion-list lines="none" class="ion-margin-top">
      <ion-list-header>
        <ion-label class="tw-font-semibold tw-tracking-wider">Brand Palette</ion-label>
      </ion-list-header>
      
      <ion-item>
        <div slot="start" class="tw-w-10 tw-h-10 tw-rounded-lg tw-bg-brand-primary"></div>
        <ion-label>
          <h3 class="tw-font-medium">Primary Green</h3>
          <p class="tw-text-xs">#1A3F22</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <div slot="start" class="tw-w-10 tw-h-10 tw-rounded-lg tw-bg-brand-secondary"></div>
        <ion-label>
          <h3 class="tw-font-medium">Secondary Green</h3>
          <p class="tw-text-xs">#58761B</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <div slot="start" class="tw-w-10 tw-h-10 tw-rounded-lg tw-bg-brand-gold"></div>
        <ion-label>
          <h3 class="tw-font-medium">Construction Gold</h3>
          <p class="tw-text-xs">#D99201</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <div class="ion-padding-top tw-flex tw-flex-col tw-gap-4">
      <ion-button expand="block" color="primary">
        Get Started
      </ion-button>
      
      <ion-button expand="block" fill="outline" color="secondary">
        Browse Materials
      </ion-button>
    </div>
  </div>
</ion-content>
