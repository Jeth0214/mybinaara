<section class="stores-section">
  <div class="section-header">
    <div class="section-title">
      <ion-icon name="map-outline" class="section-icon"></ion-icon>
      <h2 class="ion-no-margin">{{ stores().length }} Stores Nearby</h2>
    </div>
  </div>

  <div class="stores-list">
    @for (store of stores(); track store.id) {
      <div class="store-card">
        <div class="store-icon-wrapper">
          <ion-icon name="storefront-outline" class="store-icon"></ion-icon>
        </div>

        <div class="store-info">
          <p class="store-name ion-no-margin">{{ store.name }}</p>
          <span class="store-location"
            >{{ store.district }}, {{ store.city }}</span
          >
          <div class="store-distance">
            <ion-icon name="location-outline" class="distance-icon"></ion-icon>
            <span>{{ store.distanceKm }} km</span>
          </div>
        </div>

        <button class="view-store-btn">View Store →</button>
      </div>
    }
  </div>
</section>
