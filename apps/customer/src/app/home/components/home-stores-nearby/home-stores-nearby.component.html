<section class="stores-section">
  <div class="section-header">
    <div class="section-title">
      <ion-icon name="map-outline" class="section-icon"></ion-icon>
      <h2 class="ion-no-margin">{{ displayStores().length }} Stores Nearby</h2>
    </div>
  </div>

  <div class="stores-list">
    @for (store of displayStores(); track store.id) {
      <div class="store-card">
        <div class="store-icon-wrapper">
          @if (store.logo_url) {
            <img [src]="store.logo_url" [alt]="store.name" class="store-logo" />
          } @else {
            <ion-icon name="storefront-outline" class="store-icon"></ion-icon>
          }
        </div>

        <div class="store-info">
          <p class="store-name ion-no-margin">{{ store.name }}</p>
          <span class="store-location">{{ store.displayAddress }}</span>
          @if (store.distanceKm !== null) {
            <div class="store-distance">
              <ion-icon
                name="location-outline"
                class="distance-icon"
              ></ion-icon>
              <span>{{ store.distanceKm }} km</span>
            </div>
          }
        </div>

        <button class="view-store-btn" (click)="navigateToStore(store.id)">
          View Store →
        </button>
      </div>
    }
  </div>
</section>
