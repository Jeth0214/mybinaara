<section class="recent-search-section">

  <div class="section-header">
    <div class="section-title">
      <ion-icon name="time-outline" class="section-icon"></ion-icon>
      <h2 class="ion-no-margin">Recent Searches</h2>
    </div>
  </div>

  @if (recentSearches().length > 0) {
    <div class="product-carousel" #carousel>
      @for (product of recentSearches(); track product.id) {
        <div class="product-card" (click)="navigateToProduct(product.id)">
          <div class="card-image-wrapper" [style.background]="product.iconBg">
            <ion-icon [src]="getCategoryIcon(product.category)" class="product-placeholder-icon"></ion-icon>
            <ion-badge class="store-badge">{{ product.storeCount }} stores</ion-badge>
          </div>
          <div class="card-info">
            <span class="product-category">{{ product.category }}</span>
            <p class="product-title ion-no-margin">{{ product.name }}</p>
            <span class="product-brand">{{ product.brand }}</span>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <ion-icon name="search-outline" class="empty-icon"></ion-icon>
      <p>No recent searches yet.</p>
      <span>Start searching for tools & hardware!</span>
    </div>
  }

</section>
