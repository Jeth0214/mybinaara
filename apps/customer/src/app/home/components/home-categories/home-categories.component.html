<section class="categories-section">
  <div class="section-header">
    <div class="section-title">
      <ion-icon name="grid-outline" class="section-icon"></ion-icon>
      <h2 class="ion-no-margin">Categories</h2>
    </div>
  </div>

  <div class="categories-carousel">
    @for (category of categories(); track category.id) {
      <div class="category-card" [class.active]="activeCategory() === category.name" (click)="categorySelected.emit(category)">
        <div class="category-icon-wrapper">
          <ion-icon [name]="category.icon" class="category-icon"></ion-icon>
        </div>
        <span class="category-name">{{ category.name }}</span>
      </div>
    }
  </div>
</section>
